services:
  - type: web
    name: automoat-cockpit-relay
    runtime: python
    repo: https://github.com/matthoffner/tuner-landing.git
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: python3 --version
    startCommand: python3 scripts/render_cockpit_relay.py --check-env --host 0.0.0.0 --port $PORT && python3 scripts/render_cockpit_relay.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AUTOMOAT_RELAY_TOKEN
        sync: false
      - key: AUTOMOAT_RELAY_STATE_FILE
        value: /tmp/automoat-relay-state.json
  - type: worker
    name: automoat-codex-worker
    runtime: docker
    repo: https://github.com/matthoffner/tuner-landing.git
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: AUTOMOAT_GIT_REPO
        value: https://github.com/matthoffner/tuner-landing.git
      - key: AUTOMOAT_GIT_BRANCH
        value: main
      - key: AUTOMOAT_RELAY_URL
        value: https://automoat-cockpit-relay.onrender.com
      - key: AUTOMOAT_RELAY_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CODEX_AUTH_JSON_B64
        sync: false
      - key: AUTOMOAT_AGENT_INTERVAL
        value: "300"
      - key: AUTOMOAT_BUSINESS_HOURS_ENABLED
        value: "1"
      - key: AUTOMOAT_BUSINESS_HOURS_TIMEZONE
        value: America/Chicago
      - key: AUTOMOAT_BUSINESS_HOURS_START
        value: "09:00"
      - key: AUTOMOAT_BUSINESS_HOURS_END
        value: "17:00"
      - key: AUTOMOAT_BUSINESS_HOURS_DAYS
        value: mon-fri
      - key: AUTOMOAT_BUSINESS_HOURS_IDLE_SLEEP
        value: "300"
      - key: AUTOMOAT_RELAY_INTERVAL
        value: "3"
      - key: AUTOMOAT_RELAY_MAX_CONSECUTIVE_STALE_STATUSES
        value: "5"
